name: Build AutoClipper AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip AutoClipperAI-Android.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk AutoClipperAI.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" AutoClipperAI.apk \
            --title "AutoClipper AI $TAG" \
            --notes "AutoClipper AI APK"
